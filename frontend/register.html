<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inscription — GreenTasks</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="inner">
    <a href="index.html" class="logo">🌿 GreenTasks</a>
  </div>
</header>
<main>
  <div class="auth">
    <div class="card">
      <h1>Créer un compte</h1>
      <form id="form-register">
        <div class="form-group">
          <label for="nom">Nom complet *</label>
          <input type="text" id="nom" autocomplete="name" required maxlength="80" placeholder="Jean Dupont">
        </div>
        <div class="form-group">
          <label for="email">Adresse e-mail *</label>
          <input type="email" id="email" autocomplete="email" required placeholder="exemple@mail.fr">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe * <span class="muted">(6 car. min.)</span></label>
          <input type="password" id="password" autocomplete="new-password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="role">Rôle *</label>
          <select id="role">
            <option value="student">Élève</option>
            <option value="teacher">Enseignant</option>
          </select>
        </div>
        <div class="form-group" id="group-wrap">
          <label for="group_id">Groupe <span class="muted">(optionnel)</span></label>
          <select id="group_id">
            <option value="">— Aucun groupe pour l'instant —</option>
          </select>
        </div>
        <p id="msg-err" class="err hidden"></p>
        <p id="msg-ok"  class="ok  hidden"></p>
        <button type="submit" class="btn btn-primary btn-full">S'inscrire</button>
      </form>
    </div>
    <p class="auth-foot">Déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>
</main>
<footer><p>GreenTasks — TI616 EFREI Paris 2025-2026</p></footer>
<script>
const roleEl  = document.getElementById('role');
const grpWrap = document.getElementById('group-wrap');
const grpSel  = document.getElementById('group_id');

// Charger les groupes disponibles (0 requête externe)
fetch('/api/groups').then(r => r.json()).then(groups => {
  groups.forEach(g => {
    const o = document.createElement('option');
    o.value = g.id;
    o.textContent = g.name + ' (' + g.teacher + ')';
    grpSel.appendChild(o);
  });
}).catch(() => {});

roleEl.addEventListener('change', () => {
  grpWrap.classList.toggle('hidden', roleEl.value !== 'student');
});

document.getElementById('form-register').addEventListener('submit', async e => {
  e.preventDefault();
  const errEl = document.getElementById('msg-err');
  const okEl  = document.getElementById('msg-ok');
  errEl.classList.add('hidden');
  okEl.classList.add('hidden');

  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom:      document.getElementById('nom').value,
        email:    document.getElementById('email').value,
        password: document.getElementById('password').value,
        role:     roleEl.value,
        group_id: grpSel.value || null
      })
    });
    const data = await res.json();
    if (res.ok) {
      okEl.textContent = 'Compte créé avec succès ! Redirection…';
      okEl.classList.remove('hidden');
      setTimeout(() => window.location.href = 'login.html', 1300);
    } else {
      errEl.textContent = data.error;
      errEl.classList.remove('hidden');
    }
  } catch {
    errEl.textContent = 'Erreur réseau, réessayez.';
    errEl.classList.remove('hidden');
  }
});
</script>
</body>
</html>
